<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C1220" />
    <meta name="description" content="EdgeLab: replay forex charts candle by candle, journal your trades and find your edge." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230C1220'/%3E%3Crect x='7' y='9' width='5' height='12' rx='1' fill='%23CF4468'/%3E%3Cpath d='M9.5 6v3M9.5 21v4' stroke='%23CF4468' stroke-width='1.6'/%3E%3Crect x='19' y='7' width='5' height='14' rx='1' fill='%2323AAA5'/%3E%3Cpath d='M21.5 4v3M21.5 21v6' stroke='%2323AAA5' stroke-width='1.6'/%3E%3C/svg%3E" />
    <title>EdgeLab: forex backtesting and trading journal</title>
    <script>
      // Set day or night before the first paint, so the page never flashes the other theme.
      try {
        var p = localStorage.getItem('edgelab:theme');
        var light = p === 'light' || (p === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
